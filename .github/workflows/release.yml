name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Check that the tag matches version.php
        id: version
        run: |
          release=$(sed -nE "s/^\\\$plugin->release = '([^']+)';/\1/p" version.php)
          if [ "v$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match \$plugin->release '$release' in version.php"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if grep -q 'MATURITY_STABLE' version.php; then
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the installable zip
        run: git archive --format=zip --prefix=cohortaccess/ -o "local_cohortaccess-${{ steps.version.outputs.release }}.zip" HEAD

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "local_cohortaccess-${{ steps.version.outputs.release }}.zip"
          --title "$GITHUB_REF_NAME" --generate-notes ${{ steps.version.outputs.prerelease }}
